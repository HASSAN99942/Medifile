<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediFile — Dossier Patient Numérique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap');
:root{
  --teal:#0A7E6E;--teal-l:#12A08C;--teal-pale:#E6F5F3;
  --gold:#C8862A;--gold-l:#F0B85A;
  --navy:#0D1F3C;--slate:#4A5568;--mist:#F7FAFA;--white:#FFFFFF;
  --red:#E53E3E;--green:#38A169;--orange:#D69E2E;--blue:#3182CE;--purple:#6B46C1;
  --border:#D1E8E5;
  --sh-sm:0 2px 8px rgba(10,126,110,.10);
  --sh-md:0 8px 32px rgba(10,126,110,.14);
  --sh-lg:0 20px 60px rgba(13,31,60,.18);
  --r:16px;--rs:10px;--rx:6px;--sw:260px;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--mist);color:var(--navy);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--teal-l)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:99px;font-size:.7rem;font-weight:700;letter-spacing:.04em}
.b-ok{background:#C6F6D5;color:#276749}.b-warn{background:#FEFCBF;color:#744210}
.b-err{background:#FED7D7;color:#822727}.b-info{background:#BEE3F8;color:#2A4365}
.b-teal{background:var(--teal-pale);color:var(--teal)}.b-gray{background:#EDF2F7;color:var(--slate)}
.b-purple{background:#E9D8FD;color:#553C9A}.b-orange{background:#FEEBC8;color:#7B341E}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:var(--rs);font-family:var(--fb);font-size:.88rem;font-weight:500;cursor:pointer;border:none;transition:all .18s;text-decoration:none;white-space:nowrap;line-height:1}
.btn-p{background:var(--teal);color:#fff;box-shadow:0 4px 14px rgba(10,126,110,.3)}
.btn-p:hover{background:var(--teal-l);transform:translateY(-1px)}
.btn-s{background:var(--teal-pale);color:var(--teal)}.btn-s:hover{background:#d0ede9}
.btn-g{background:transparent;color:var(--slate);border:1.5px solid var(--border)}.btn-g:hover{border-color:var(--teal);color:var(--teal)}
.btn-d{background:var(--red);color:#fff}.btn-d:hover{background:#c53030}
.btn-purple{background:var(--purple);color:#fff}.btn-purple:hover{background:#553C9A}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:#a16820}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#2f855a}
.btn-sm{padding:6px 13px;font-size:.8rem;border-radius:var(--rx)}
.btn-lg{padding:14px 28px;font-size:1rem}
.btn-xl{padding:16px 32px;font-size:1.05rem;border-radius:var(--r)}
.btn-full{width:100%;justify-content:center}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed}

/* CARDS */
.card{background:var(--white);border-radius:var(--r);padding:24px;box-shadow:var(--sh-sm);border:1px solid var(--border);transition:box-shadow .2s}
.card:hover{box-shadow:var(--sh-md)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.card-ttl{font-family:var(--fh);font-size:1rem;font-weight:700;color:var(--navy)}

/* FORMS */
.fg{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:.75rem;font-weight:700;color:var(--slate);letter-spacing:.05em;text-transform:uppercase}
.fc{padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--rs);font-family:var(--fb);font-size:.9rem;color:var(--navy);background:var(--white);transition:all .2s;outline:none;width:100%}
.fc:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,126,110,.12)}
.fc::placeholder{color:#b0bec5}
textarea.fc{resize:vertical;min-height:80px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.input-wrap{position:relative}
.input-wrap .input-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--slate);font-size:1rem;pointer-events:none}
.input-wrap .fc{padding-left:40px}
.input-wrap .fc-pass{padding-right:40px}
.input-wrap .toggle-pass{position:absolute;right:13px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1rem;color:var(--slate)}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;width:var(--sw);height:100vh;background:var(--navy);display:flex;flex-direction:column;z-index:200;transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;will-change:transform}
.s-logo{padding:26px 22px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:var(--teal);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.logo-txt{font-family:var(--fh);font-size:1.25rem;font-weight:800;color:#fff}
.logo-txt span{color:var(--gold-l)}
.s-role-tag{font-size:.6rem;color:rgba(255,255,255,.35);letter-spacing:.12em;text-transform:uppercase;margin-top:5px}
.s-nav{padding:14px 10px;flex:1}
.s-sect{font-size:.62rem;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase;padding:10px 12px 5px}
.ni{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--rs);color:rgba(255,255,255,.62);font-size:.88rem;font-weight:500;cursor:pointer;transition:all .15s;margin-bottom:1px;background:none;border:none;width:100%;text-align:left;font-family:var(--fb)}
.ni:hover{background:rgba(255,255,255,.07);color:#fff}
.ni.act{background:var(--teal);color:#fff;box-shadow:0 4px 12px rgba(10,126,110,.4)}
.ni .ic{font-size:.95rem;width:18px;text-align:center;flex-shrink:0}
.ni .nb{margin-left:auto;background:var(--gold);color:#fff;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:99px}
.s-foot{padding:14px 10px 22px;border-top:1px solid rgba(255,255,255,.08)}
.u-chip{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--rs);background:rgba(255,255,255,.06);cursor:pointer}
.u-chip:hover{background:rgba(255,255,255,.1)}
.av{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.av-lg{width:64px;height:64px;font-size:1.4rem;border-radius:16px}
.av-xl{width:80px;height:80px;font-size:1.7rem;border-radius:20px}
.u-name{font-size:.85rem;font-weight:600;color:#fff}
.u-role{font-size:.7rem;color:rgba(255,255,255,.4)}

/* BURGER */
.burger{display:none;position:fixed;top:13px;left:13px;z-index:500;width:44px;height:44px;background:var(--navy);color:#fff;border:none;border-radius:var(--rs);font-size:1.25rem;cursor:pointer;align-items:center;justify-content:center;box-shadow:var(--sh-md);transition:background .2s;line-height:1}
.burger:hover{background:var(--teal)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:199;backdrop-filter:blur(2px)}
.overlay.on{display:block}

/* LAYOUT */
.main{margin-left:var(--sw);min-height:100vh}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 30px;height:66px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tb-l{display:flex;align-items:center;gap:14px}
.pg-ttl{font-family:var(--fh);font-size:1.25rem;font-weight:700;color:var(--navy)}
.tb-r{display:flex;align-items:center;gap:10px}
.srch{display:flex;align-items:center;gap:9px;background:var(--mist);border:1.5px solid var(--border);border-radius:var(--rs);padding:8px 14px;transition:border-color .2s}
.srch:focus-within{border-color:var(--teal)}
.srch input{border:none;background:none;outline:none;font-family:var(--fb);font-size:.85rem;color:var(--navy);width:180px}
.srch input::placeholder{color:#b0bec5}
.ibtn{width:40px;height:40px;border-radius:var(--rs);background:var(--mist);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:.95rem;position:relative}
.ibtn:hover{border-color:var(--teal);color:var(--teal)}
.ndot{position:absolute;top:5px;right:5px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--white)}
.content{padding:28px 30px}

/* STAT CARDS */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
.scard{background:var(--white);border-radius:var(--r);padding:20px;border:1px solid var(--border);position:relative;overflow:hidden;box-shadow:var(--sh-sm);cursor:pointer;transition:all .2s}
.scard:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
.scard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.sc-teal::before{background:var(--teal)}.sc-gold::before{background:var(--gold)}
.sc-blue::before{background:var(--blue)}.sc-green::before{background:var(--green)}
.sc-red::before{background:var(--red)}.sc-purple::before{background:var(--purple)}
.s-lbl{font-size:.68rem;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.s-val{font-family:var(--fh);font-size:1.9rem;font-weight:800;color:var(--navy);line-height:1}
.s-sub{font-size:.75rem;color:var(--slate);margin-top:5px}
.s-ico{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:1.9rem;opacity:.1}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:9px 15px;text-align:left;font-size:.68rem;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.07em;background:var(--mist);border-bottom:1px solid var(--border)}
td{padding:13px 15px;border-bottom:1px solid rgba(209,232,229,.45);font-size:.88rem;color:var(--navy)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--teal-pale)}
.tact{display:flex;gap:5px}

/* TIMELINE */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:22px}
.tl-dot{position:absolute;left:-21px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--teal);border:2px solid var(--white);box-shadow:0 0 0 2px var(--teal)}
.tl-dot.g{background:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.tl-dot.b{background:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.tl-dot.r{background:var(--red);box-shadow:0 0 0 2px var(--red)}
.tl-dot.p{background:var(--purple);box-shadow:0 0 0 2px var(--purple)}
.tl-d{font-size:.7rem;color:var(--slate);font-weight:600;margin-bottom:3px}
.tl-t{font-weight:600;font-size:.88rem;color:var(--navy);margin-bottom:2px}
.tl-s{font-size:.8rem;color:var(--slate)}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(13,31,60,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px);animation:fi .18s ease}
.md{background:var(--white);border-radius:var(--r);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;animation:su .22s ease;box-shadow:var(--sh-lg)}
.md-hdr{padding:22px 26px 0;display:flex;align-items:center;justify-content:space-between}
.md-ttl{font-family:var(--fh);font-size:1.15rem;font-weight:700}
.md-cls{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--slate);padding:4px;border-radius:var(--rx);line-height:1}
.md-cls:hover{color:var(--red)}
.md-bod{padding:18px 26px}
.md-ftr{padding:0 26px 22px;display:flex;gap:8px;justify-content:flex-end}

/* TOASTS */
.toasts{position:fixed;bottom:22px;right:22px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:13px 18px;border-radius:var(--rs);font-size:.85rem;display:flex;align-items:center;gap:9px;box-shadow:var(--sh-lg);animation:sl .28s ease;max-width:320px}
.toast.ok{background:var(--green)}.toast.er{background:var(--red)}.toast.wa{background:var(--orange)}

/* TABS */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:22px;flex-wrap:wrap;overflow-x:auto}
.tab{padding:9px 18px;font-size:.85rem;font-weight:500;color:var(--slate);cursor:pointer;border:none;background:none;font-family:var(--fb);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .18s;white-space:nowrap}
.tab.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
.tab:hover:not(.on){color:var(--navy)}
.tc{display:none}.tc.on{display:block}

/* PROGRESS */
.pbar{height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.pfill{height:100%;border-radius:99px;background:var(--teal);transition:width .5s}

/* TAGS */
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--teal-pale);color:var(--teal);padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:600}

/* EMPTY */
.empty{text-align:center;padding:44px 22px;color:var(--slate)}
.empty-ic{font-size:2.8rem;margin-bottom:14px;opacity:.35}
.empty-t{font-family:var(--fh);font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:6px}
.empty-s{font-size:.83rem;max-width:280px;margin:0 auto}

/* AUTH */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-brand{background:var(--navy);padding:56px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.auth-brand::before{content:'';position:absolute;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(10,126,110,.3) 0%,transparent 70%);top:-100px;right:-100px}
.auth-brand::after{content:'';position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(200,134,42,.2) 0%,transparent 70%);bottom:-70px;left:-70px}
.auth-tag{font-family:var(--fh);font-size:2.2rem;font-weight:800;color:#fff;line-height:1.15;margin:22px 0 14px;position:relative;z-index:1}
.auth-tag span{color:var(--gold-l)}
.auth-desc{color:rgba(255,255,255,.58);font-size:.9rem;line-height:1.65;position:relative;z-index:1;max-width:360px}
.auth-feats{margin-top:36px;display:flex;flex-direction:column;gap:13px;position:relative;z-index:1}
.auth-feat{display:flex;align-items:center;gap:11px;color:rgba(255,255,255,.72);font-size:.85rem}
.auth-feat-ic{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.auth-side{background:var(--white);padding:56px;display:flex;align-items:center;justify-content:center;overflow-y:auto}
.auth-box{width:100%;max-width:420px}
.auth-ttl{font-family:var(--fh);font-size:1.7rem;font-weight:800;color:var(--navy);margin-bottom:4px}
.auth-sub{color:var(--slate);font-size:.88rem;margin-bottom:28px}
.auth-form{display:flex;flex-direction:column;gap:16px}
.role-sel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-c{padding:13px 10px;border:2px solid var(--border);border-radius:var(--rs);cursor:pointer;transition:all .18s;text-align:center}
.role-c:hover{border-color:var(--teal-l)}
.role-c.sel{border-color:var(--teal);background:var(--teal-pale)}
.role-ic{font-size:1.5rem;margin-bottom:5px}
.role-lb{font-size:.8rem;font-weight:600;color:var(--navy)}
.auth-link{color:var(--teal);text-decoration:none;font-size:.85rem;font-weight:500}
.auth-link:hover{text-decoration:underline}
.auth-divider{text-align:center;position:relative;color:var(--slate);font-size:.8rem;margin:4px 0}
.auth-divider::before,.auth-divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--border)}
.auth-divider::before{left:0}.auth-divider::after{right:0}
.step-indicator{display:flex;align-items:center;margin-bottom:28px}
.step-w{display:flex;flex-direction:column;align-items:center}
.step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0;transition:all .2s}
.step-dot.done{background:var(--green);color:#fff}
.step-dot.active{background:var(--teal);color:#fff;box-shadow:0 0 0 4px rgba(10,126,110,.2)}
.step-dot.wait{background:var(--border);color:var(--slate)}
.step-line{flex:1;height:2px;background:var(--border);min-width:20px}
.step-line.done{background:var(--green)}
.step-lbl{font-size:.6rem;font-weight:600;text-align:center;margin-top:4px;color:var(--slate);max-width:60px}
.step-lbl.active{color:var(--teal)}

/* CONSENT SYSTEM */
.consent-banner{background:linear-gradient(135deg,var(--purple) 0%,#4a2080 100%);border-radius:var(--r);padding:24px 28px;color:#fff;position:relative;overflow:hidden}
.consent-banner::before{content:'🔒';position:absolute;right:-10px;top:-10px;font-size:7rem;opacity:.08}
.consent-code{font-family:'Courier New',monospace;font-size:2.4rem;font-weight:800;letter-spacing:8px;color:#fff;background:rgba(255,255,255,.15);border-radius:var(--rs);padding:16px 24px;text-align:center;margin:14px 0;border:2px dashed rgba(255,255,255,.35);user-select:all;cursor:copy}
.timer-row{display:flex;align-items:center;gap:10px;font-size:.82rem;opacity:.85}
.timer-track{flex:1;height:4px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.timer-fill{height:100%;background:#fff;border-radius:99px;transition:width 1s linear}
.qr-container{background:var(--white);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;border:2px solid var(--border)}
.qr-canvas{width:180px;height:180px;border-radius:var(--rs);overflow:hidden}
.access-req{border:2px solid var(--purple);border-radius:var(--r);padding:18px;margin-bottom:12px;background:#faf5ff;transition:all .2s}
.access-req.pending{border-color:var(--orange);background:#fffbeb}
.access-req.granted{border-color:var(--green);background:#f0fff4}
.access-req.denied{border-color:var(--red);background:#fff5f5}
.audit-row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid rgba(209,232,229,.5)}
.audit-row:last-child{border-bottom:none}
.audit-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}

/* HOSPITAL CARD */
.hosp-card{border:1px solid var(--border);border-radius:var(--r);padding:18px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .18s;background:var(--white);margin-bottom:10px}
.hosp-card:hover{border-color:var(--teal);box-shadow:var(--sh-sm)}
.hosp-card.selected{border-color:var(--teal);border-width:2px;background:var(--teal-pale)}
.hosp-logo{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0}

/* VITALS */
.vrow{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.vcard{background:var(--white);border-radius:var(--rs);padding:14px 18px;border:1px solid var(--border);flex:1;min-width:120px;box-shadow:var(--sh-sm)}
.v-val{font-family:var(--fh);font-size:1.45rem;font-weight:800;color:var(--teal);line-height:1}
.v-lbl{font-size:.68rem;color:var(--slate);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}

/* PATIENT HERO */
.p-hero{border-radius:var(--r);padding:26px 30px;margin-bottom:26px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--teal) 0%,#084d44 100%)}
.p-hero::before{content:'🩺';position:absolute;right:-20px;top:-20px;font-size:8rem;opacity:.07;line-height:1}

/* MISC */
.dgrid{display:grid;grid-template-columns:2fr 1fr;gap:22px}
.dg2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.ph{background:var(--white);border-radius:var(--r);padding:26px;border:1px solid var(--border);display:flex;align-items:center;gap:22px;margin-bottom:22px;box-shadow:var(--sh-sm);flex-wrap:wrap}
.ph-info{flex:1;min-width:180px}
.ph-name{font-family:var(--fh);font-size:1.45rem;font-weight:800;color:var(--navy);margin-bottom:3px}
.ph-id{font-size:.75rem;color:var(--slate);font-family:monospace}
.ph-act{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.med-pill{display:flex;align-items:center;gap:14px;padding:13px;background:var(--teal-pale);border-radius:var(--rs);margin-bottom:8px}
.med-ico{width:42px;height:42px;background:var(--teal);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;color:#fff}
.off-bar{background:var(--orange);color:var(--navy);padding:7px 20px;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:7px;justify-content:center}

/* LOCK SCREEN DOCTOR */
.locked-dossier{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border-radius:var(--r);padding:40px;text-align:center;color:#fff;border:2px solid rgba(107,70,193,.4)}
.lock-icon{font-size:4rem;margin-bottom:16px;opacity:.8}
.lock-title{font-family:var(--fh);font-size:1.4rem;font-weight:800;margin-bottom:8px}
.lock-sub{opacity:.65;font-size:.9rem;margin-bottom:24px;line-height:1.6}
.lock-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.lock-method{background:rgba(255,255,255,.08);border-radius:var(--rs);padding:16px 12px;cursor:pointer;border:2px solid transparent;transition:all .2s;text-align:center}
.lock-method:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.12)}
.lock-method.sel{border-color:var(--teal);background:rgba(10,126,110,.2)}
.lock-method-ic{font-size:1.8rem;margin-bottom:7px}
.lock-method-lb{font-size:.75rem;font-weight:600;opacity:.85}

/* ANIMATIONS */
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes sl{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes countdown{from{width:100%}to{width:0%}}
.ani{animation:su .35s ease}
.pulse{animation:pulse 2s infinite}

/* RESPONSIVE */
@media(max-width:1100px){.sgrid{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.dgrid{grid-template-columns:1fr}.dg2{grid-template-columns:1fr}.lock-methods{grid-template-columns:1fr}}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--sh-lg)}
  .burger{display:flex}
  .main{margin-left:0}
  .topbar{padding:0 14px 0 70px;height:60px}
  .pg-ttl{font-size:1rem}
  .content{padding:18px 14px}
  .sgrid{grid-template-columns:1fr 1fr;gap:10px}
  .srch{display:none}
  .fgrid{grid-template-columns:1fr}
  .fgrid3{grid-template-columns:1fr}
  .auth-wrap{grid-template-columns:1fr}
  .auth-brand{display:none}
  .auth-side{padding:36px 22px}
  .lock-methods{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){.sgrid{grid-template-columns:1fr 1fr}.role-sel{grid-template-columns:1fr}}
@media print{.sidebar,.burger,.topbar,.btn,.mo{display:none!important}.main{margin-left:0}.content{padding:0}.card{box-shadow:none;border:1px solid #ccc}}

function fdh(s){ if(!s)return'—';const d=new Date(s);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})+" à "+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }

/* ── BURGER (global, toujours dispo) ─────── */
function toggleSidebar(){
  const s=document.getElementById('sidebar'),o=document.getElementById('overlay'),b=document.getElementById('burger');
  if(!s)return;
  const open=s.classList.toggle('open');
  if(o)o.classList.toggle('on',open);
  if(b)b.textContent=open?'✕':'☰';
}
function closeSidebar(){
  const s=document.getElementById('sidebar'),o=document.getElementById('overlay'),b=document.getElementById('burger');
  if(s)s.classList.remove('open');
  if(o)o.classList.remove('on');
  if(b)b.textContent='☰';
}

/* ── STATE ────────────────────────────────── */
const S = { page:'login', sub:null, pid:null, q:'', online:navigator.onLine };

/* ── ROUTER ───────────────────────────────── */
function go(page, pid=null, sub=null){
  S.page=page; S.pid=pid; S.sub=sub;
  closeSidebar();
  render();
  window.scrollTo(0,0);
}

/* ── TOAST ────────────────────────────────── */
function toast(msg,type='ok',dur=3500){
  const c=document.getElementById('toasts');
  if(!c)return;
  const icons={ok:'✅',er:'❌',wa:'⚠️',info:'ℹ️'};
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  t.innerHTML=`<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .4s'; setTimeout(()=>t.remove(),400); },dur);
}

/* ── MODAL ────────────────────────────────── */
function setModal(html){ document.getElementById('modal-wrap').innerHTML=html; }
function closeModal(e){ if(!e||e.target.classList.contains('mo')) document.getElementById('modal-wrap').innerHTML=''; }
function closeModalForce(){ document.getElementById('modal-wrap').innerHTML=''; }

/* ── RENDER ───────────────────────────────── */
function render(){
  const root=document.getElementById('root');
  const sw=document.getElementById('sidebar-wrap');
  const burger=document.getElementById('burger');
  if(!root)return;

  const role=DB.session.role;

  // Sidebar
  if(role==='doctor'){  sw.innerHTML=sidebarDoctor(); if(burger)burger.style.display=''; }
  else if(role==='patient'){ sw.innerHTML=sidebarPatient(); if(burger)burger.style.display=''; }
  else if(role==='admin'){  sw.innerHTML=sidebarAdmin();  if(burger)burger.style.display=''; }
  else{ sw.innerHTML=''; if(burger)burger.style.display='none'; }

  // Page
  const pages={
    login,register,
    'd-home':dHome,'d-patients':dPatients,'d-patient':dPatient,
    'd-rdv':dRdv,'d-ordos':dOrdos,'d-results':dResults,'d-settings':dSettings,
    'd-locked':dLocked,
    'p-home':pHome,'p-histo':pHisto,'p-ordos':pOrdos,'p-results':pResults,
    'p-rdv':pRdv,'p-docs':pDocs,'p-acces':pAcces,'p-profil':pProfil,
    'a-home':aHome,'a-medecins':aMedecins,'a-patients':aPatients,
    'a-hopital':aHopital,'a-stats':aStats,
  };
  const fn=pages[S.page]||login;
  root.innerHTML=fn();
  document.getElementById('modal-wrap').innerHTML='';
}

/* ── AUTH ─────────────────────────────────── */
function logout(){
  if(confirm('Voulez-vous vraiment vous déconnecter ?')){
    DB.session.role=null; DB.session.userId=null; DB.session.hopId=null;
    go('login'); toast('Déconnexion réussie','info');
  }
}

/* ── UTILS ────────────────────────────────── */
function switchTab(btn,id){
  const tabs=btn.closest('.tabs')?.querySelectorAll('.tab');
  tabs&&tabs.forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  const area=document.querySelector('.content')||document.body;
  area.querySelectorAll('.tc').forEach(tc=>tc.classList.remove('on'));
  const el=document.getElementById(id);
  if(el)el.classList.add('on');
}

function selectLockMethod(m){

}

function drawQR(){
  const canvas=document.getElementById('qr-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const size=160;
  // Dessiner un QR code stylisé (simulation)
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,size,size);
  ctx.fillStyle='#0D1F3C';
  // Coins finder patterns
  [[0,0],[size-42,0],[0,size-42]].forEach(([x,y])=>{
    ctx.fillRect(x+2,y+2,38,38);
    ctx.fillStyle='#ffffff';
    ctx.fillRect(x+7,y+7,28,28);
    ctx.fillStyle='#0D1F3C';
    ctx.fillRect(x+12,y+12,18,18);
  });
  // Data cells (random pattern)
  const rng=(seed)=>{ let x=Math.sin(seed)*10000; return x-Math.floor(x); };
  for(let r=0;r<size;r+=5){
    for(let c=0;c<size;c+=5){
      if(r<50&&(c<50||c>size-55))continue;
      if(r>size-55&&c<50)continue;
      if(rng(r*100+c)>0.5){ ctx.fillStyle='#0D1F3C'; ctx.fillRect(c,r,4,4); }
    }
  }
  // Logo au centre
  ctx.fillStyle='#0A7E6E';
  ctx.fillRect(66,66,28,28);
  ctx.fillStyle='#fff';
  ctx.font='18px serif';
  ctx.textAlign='center';
  ctx.fillText('🩺',80,83);
}

function validateCode(patientId){
  const input=document.getElementById('code-input')?.value.trim();
  const p=getPatient(patientId);
  if(!p){ toast('Patient introuvable','er'); return; }
  const stored=DB.session.temp_code;
  const expires=DB.session.temp_code_expires;

  // Simulation : code 123456 toujours valide en démo, ou code stocké en session
  if(input==='123456'||(stored&&input===stored&&new Date()<new Date(expires))){
    grantAccess(patientId,'code_temporaire');
  } else {
    toast('Code invalide ou expiré. Demandez un nouveau code au patient.','er');
    const inp=document.getElementById('code-input');
    if(inp){ inp.style.borderColor='var(--red)'; inp.style.boxShadow='0 0 0 3px rgba(229,62,62,.2)'; }
  }
}

function sendAccessRequest(patientId){
  const p=getPatient(patientId);
  const m=getCurrentMedecin()||DB.medecins[0];
  const hop=getHopital(m.hop);
  const motif=document.getElementById('req-motif')?.value||'consultation';
  const duree=document.getElementById('req-duree')?.value||'24h';

  const req={
    id:'REQ'+Date.now().toString().slice(-6),
    medId:m.id,
    med:`Dr. ${m.prenom} ${m.nom}`,
    spec:m.spec,
    hop:hop?.nom||'—',
    hopId:m.hop,
    motif,
    duree,
    statut:'pending',
    date:new Date().toISOString(),
  };
  p.demandes_acces.push(req);
  DB.session.consent_pending=req;

  toast(`Demande envoyée à ${p.prenom} ${p.nom} — notification SMS envoyée`,'ok');
  setTimeout(()=>go('d-locked',patientId),800);
}

function grantAccess(patientId, method){
  const p=getPatient(patientId);
  const m=getCurrentMedecin()||DB.medecins[0];
  const hop=getHopital(m.hop);

  // Ajouter au journal d'audit
  p.journal_audit.unshift({
    id:'AUD'+Date.now().toString().slice(-6),
    date:new Date().toISOString(),
    medId:m.id,
    med:`Dr. ${m.prenom} ${m.nom}`,
    hop:hop?.nom||'—',
    action:`Accès accordé via ${method==='code_temporaire'?'code temporaire':method==='qr_code'?'QR Code':'demande validée'}`,
    ip:'192.168.'+Math.floor(Math.random()*255)+'.'+Math.floor(Math.random()*255),
  });

  // Ajouter accès temporaire si pas déjà présent
  const existing=p.acces_actifs.find(a=>a.medId===m.id);
  if(!existing){
    p.acces_actifs.push({
      id:'ACC'+Date.now().toString().slice(-6),
      medId:m.id,
      med:`Dr. ${m.prenom} ${m.nom}`,
      hop:hop?.nom||'—',
      depuis:new Date().toISOString().split('T')[0],
      expire:method==='code_temporaire'?getDatePlusDays(1):null,
      statut:method==='code_temporaire'?'24h':'permanent',
      portee:['consultations','ordos','results','docs'],
    });
  }

  toast(`✅ Accès accordé ! Dossier de ${p.prenom} ${p.nom} déverrouillé`,'ok');
  setTimeout(()=>go('d-patient',patientId),600);
}

function getDatePlusDays(n){
  const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().split('T')[0];
}

function motifLabel(m){ return{consultation:'Consultation médicale',urgence:'Urgence médicale',bilan:'Bilan de santé',suivi:'Suivi de traitement'}[m]||m; }
function dureeLabel(d){ return{'24h':'24 heures','7j':'7 jours','30j':'30 jours',perm:'Accès permanent'}[d]||d; }
function porteeLabel(pr){ return{consultations:'Consultations',ordos:'Ordonnances',results:'Résultats',docs:'Documents'}[pr]||pr; }

/* ── ACTIONS CONSENTEMENT ─────────────────── */
function approveRequest(reqId, patId){
  const p=getPatient(patId);
  const req=p.demandes_acces.find(d=>d.id===reqId);
  if(!req) return;
  req.statut='approved';

  const expire=req.duree==='24h'?getDatePlusDays(1):req.duree==='7j'?getDatePlusDays(7):req.duree==='30j'?getDatePlusDays(30):null;
  p.acces_actifs.push({
    id:'ACC'+Date.now().toString().slice(-6),
    medId:req.medId, med:req.med, hop:req.hop,
    depuis:new Date().toISOString().split('T')[0],
    expire, statut:req.duree==='perm'?'permanent':req.duree,
    portee:['consultations','ordos','results','docs'],
  });
  p.journal_audit.unshift({
    id:'AUD'+Date.now().toString().slice(-6),
    date:new Date().toISOString(),
    medId:req.medId, med:req.med, hop:req.hop,
    action:`Accès approuvé par le patient (demande ${req.motif})`,
    ip:'—',
  });

  toast(`Accès accordé à ${req.med}`,'ok');
  render();
}

function denyRequest(reqId, patId){
  const p=getPatient(patId);
  const req=p.demandes_acces.find(d=>d.id===reqId);
  if(req){ req.statut='denied'; }
  toast('Demande refusée','wa');
  render();
}

function revokeAccess(accId, patId){
  if(!confirm('Révoquer cet accès ? Le médecin ne pourra plus consulter votre dossier.')) return;
  const p=getPatient(patId);
  const idx=p.acces_actifs.findIndex(a=>a.id===accId);
  if(idx>-1){
    const acc=p.acces_actifs[idx];
    p.acces_actifs.splice(idx,1);
    p.journal_audit.unshift({
      id:'AUD'+Date.now().toString().slice(-6),
      date:new Date().toISOString(),
      medId:acc.medId, med:acc.med, hop:acc.hop,
      action:'Accès révoqué par le patient',
      ip:'—',
    });
  }
  toast('Accès révoqué avec succès','ok');
  render();
}

          <strong>Comment utiliser ce code :</strong>
          <ol style="margin-top:8px;padding-left:20px;display:flex;flex-direction:column;gap:5px">
            <li>Donnez ce code au médecin qui vous consulte</li>
            <li>Le médecin le saisit dans son interface MediFile</li>
            <li>L'accès est automatiquement accordé pour <strong>24 heures</strong></li>

          </ol>
        </div>
      </div>
      <div class="md-ftr">
        <button class="btn btn-g" onclick="closeModalForce();clearCodeTimer()">Fermer</button>
        <button class="btn btn-p" onclick="regenerateCode()">🔄 Nouveau code</button>
      </div>
    </div>
  </div>`);

  window._codeTimer=setInterval(()=>{
    timeLeft--;
    const fill=document.getElementById('timer-fill');
    const text=document.getElementById('timer-text');
    if(!fill||!text){ clearInterval(window._codeTimer); return; }
    const pct=(timeLeft/600)*100;

    const m=Math.floor(timeLeft/60), s=timeLeft%60;

    if(timeLeft<=0){ clearInterval(window._codeTimer); DB.session.temp_code=null; toast('Code expiré — générez-en un nouveau','wa'); closeModalForce(); }
  },1000);
}

  clearCodeTimer();
  closeModalForce();
  setTimeout(()=>showGenerateCodeModal(),100);
}

function showQrModal(){
  const p=getCurrentPatient();
  if(!p)return;
  setModal(`
  <div class="mo" onclick="closeModal(event)">
    <div class="md">
      <div class="md-hdr"><div class="md-ttl">📱 Mon QR Code d'accès</div><button class="md-cls" onclick="closeModalForce()">✕</button></div>
      <div class="md-bod">
        <div style="text-align:center;margin-bottom:16px">
          <div style="font-size:.85rem;color:var(--slate);margin-bottom:14px">
            Montrez ce QR Code au médecin pour lui permettre de demander l'accès à votre dossier. Vous devrez ensuite confirmer depuis l'application.
          </div>
          <div style="display:inline-flex;flex-direction:column;align-items:center;background:var(--white);border-radius:var(--r);padding:20px;border:2px solid var(--border)">
            <canvas id="qr-pat-canvas" width="180" height="180" style="border-radius:var(--rs)"></canvas>
            <div style="font-size:.72rem;color:var(--slate);margin-top:10px">Scanner avec l'app MediFile</div>
            <div style="font-family:monospace;font-size:.72rem;background:var(--mist);padding:4px 10px;border-radius:4px;margin-top:4px">${p.id} · ${p.prenom} ${p.nom}</div>
          </div>
        </div>
        <div style="background:var(--teal-pale);border-radius:var(--rs);padding:12px;font-size:.8rem;color:var(--teal)">
          🔒 Ce QR Code ne donne <strong>pas</strong> directement accès. Il permet au médecin de soumettre une demande. Vous approuvez ou refusez chaque accès.
        </div>
      </div>
      <div class="md-ftr">
        <button class="btn btn-p btn-full" onclick="closeModalForce()">Fermer</button>
      </div>
    </div>
  </div>`);
  setTimeout(()=>{
    const canvas=document.getElementById('qr-pat-canvas');
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const sz=180;
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,sz,sz);
    ctx.fillStyle='#0D1F3C';
    [[0,0],[sz-44,0],[0,sz-44]].forEach(([x,y])=>{
      ctx.fillRect(x+2,y+2,40,40);
      ctx.fillStyle='#fff'; ctx.fillRect(x+7,y+7,30,30);
      ctx.fillStyle='#0D1F3C'; ctx.fillRect(x+12,y+12,20,20);
      ctx.fillStyle='#0D1F3C';
    });
    const rng=(s)=>{ let x=Math.sin(s+42)*10000; return x-Math.floor(x); };
    for(let r=0;r<sz;r+=5){ for(let c=0;c<sz;c+=5){
      if(r<55&&(c<55||c>sz-60))continue; if(r>sz-60&&c<55)continue;
      if(rng(r*100+c)>0.5){ ctx.fillStyle='#0A7E6E'; ctx.fillRect(c,r,4,4); }
    }}
    ctx.fillStyle='#0A7E6E'; ctx.fillRect(70,70,40,40);
    ctx.fillStyle='#fff'; ctx.font='24px serif'; ctx.textAlign='center'; ctx.fillText('🩺',90,95);
  },50);
}

/* ── OUVERTURE DOSSIER (avec check accès) ─── */
function openPatientDossier(pid){
  const m=getCurrentMedecin()||DB.medecins[0];
  const p=getPatient(pid);
  if(!p){ toast('Patient introuvable','er'); return; }
  // Vérifier si le médecin a accès
  const hasAccess=p.acces_actifs.some(a=>a.medId===m.id);
  // Si même hôpital ET médecin référent → accès direct
  const isSameHop=p.hopital_inscrit===m.hop;
  const isRef=p.medref===m.id;
  if(hasAccess||isRef){
    go('d-patient',pid);
  } else {
    go('d-locked',pid);
  }
}

function saveConsult(pid){
  const p=getPatient(pid);
  const m=getCurrentMedecin()||DB.medecins[0];
  const hop=getHopital(m.hop);
  const motif=document.getElementById('c-motif')?.value||'Consultation';

  const notes=document.getElementById('c-notes')?.value||'';
  const ta=document.getElementById('c-ta')?.value||'—';
  const spo2v=document.getElementById('c-spo2')?.value;

  const type=document.getElementById('c-type')?.value||'Consultation';
  const date=document.getElementById('c-date')?.value||new Date().toISOString().split('T')[0];
  if(p){

  closeModalForce();
  toast('Consultation enregistrée','ok');
  if(S.page==='d-patient') go('d-patient',pid); else render();
}

function checkPwdStrength(v){
  const bar=document.getElementById('pwd-bar'),hint=document.getElementById('pwd-hint-d');
  if(!bar||!hint)return;
  let s=0;if(v.length>=8)s++;if(/[A-Z]/.test(v))s++;if(/[0-9]/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;
  bar.style.width=[0,25,50,75,100][s]+'%';
  bar.style.background=['var(--red)','var(--red)','var(--orange)','var(--gold)','var(--green)'][s];
  hint.textContent=['','Faible','Moyen','Fort','Très fort'][s]||'';
}

                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}

/* ── STATISTIQUES ADMIN ───────────────────── */
function aStats(){
  const hop=getHopital(DB.session.hopId)||DB.hopitaux[0];
  const myPats=DB.patients.filter(p=>p.hopital_inscrit===hop.id);
  const allConsults=myPats.flatMap(p=>p.consultations);
  const allAudit=myPats.flatMap(p=>p.journal_audit);
  const urgences=allConsults.filter(c=>c.type==='Urgence').length;
  const interHop=allAudit.filter(a=>a.hop!==hop.nom).length;

  return`
  <div class="main ani">
    ${topbar('Statistiques',false)}
    <div class="content">
      <div style="margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
        <p style="color:var(--slate);font-size:.88rem">Vue d'ensemble — ${hop.nom}</p>
        <button class="btn btn-g btn-sm" onclick="toast('Export PDF des statistiques en cours…','info')">⬇️ Exporter PDF</button>
      </div>

      <div class="sgrid" style="margin-bottom:24px">
        <div class="scard sc-teal"><div class="s-lbl">Total consultations</div><div class="s-val">${allConsults.length}</div><div class="s-sub">Toutes périodes</div><div class="s-ico">🩺</div></div>
        <div class="scard sc-red"><div class="s-lbl">Urgences</div><div class="s-val">${urgences}</div><div class="s-sub">${allConsults.length>0?Math.round(urgences/allConsults.length*100):0}% des consultations</div><div class="s-ico">🚨</div></div>
        <div class="scard sc-purple"><div class="s-lbl">Accès inter-hôpitaux</div><div class="s-val">${interHop}</div><div class="s-sub">Avec consentement</div><div class="s-ico">🔐</div></div>
        <div class="scard sc-gold"><div class="s-lbl">Journaux d'audit</div><div class="s-val">${allAudit.length}</div><div class="s-sub">Entrées totales</div><div class="s-ico">📋</div></div>
      </div>

      <div class="dg2">
        <div class="card">
          <div class="card-ttl" style="margin-bottom:16px">📊 Répartition par statut patient</div>
          ${['Actif','Surveillance','Critique'].map(st=>{
            const n=myPats.filter(p=>p.statut===st).length;
            const pct=myPats.length>0?Math.round(n/myPats.length*100):0;
            const col=st==='Actif'?'var(--green)':st==='Surveillance'?'var(--orange)':'var(--red)';
            return`
            <div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;font-size:.83rem;margin-bottom:5px">
                <span style="font-weight:600">${st}</span>
                <span style="color:var(--slate)">${n} patients (${pct}%)</span>
              </div>
              <div class="pbar"><div class="pfill" style="width:${pct}%;background:${col}"></div></div>
            </div>`;}).join('')}

          <div style="margin-top:20px">
            <div class="card-ttl" style="margin-bottom:14px">🔐 Consentements accordés</div>
            ${myPats.map(p=>`
              <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(209,232,229,.5);font-size:.83rem">
                <span>${p.prenom} ${p.nom}</span>
                <span class="badge b-teal">${p.acces_actifs.length} accès</span>
              </div>`).join('')}
          </div>
        </div>

        <div class="card">
          <div class="card-ttl" style="margin-bottom:16px">📋 Journal d'audit global</div>
          <div style="font-size:.78rem;color:var(--slate);margin-bottom:12px">${allAudit.length} entrée(s) au total</div>
          ${allAudit.slice(0,10).map(a=>`
            <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(209,232,229,.4)">
              <span style="font-size:1rem;flex-shrink:0">${a.action.includes('urgence')?'🚨':a.action.includes('révoqué')?'🔒':a.action.includes('approuvé')?'✅':'👁️'}</span>
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.med}</div>
                <div style="font-size:.75rem;color:var(--slate)">${a.action}</div>
                <div style="font-size:.7rem;color:var(--slate)">${fdh(a.date)}</div>
              </div>
            </div>`).join('')}
          ${allAudit.length>10?`<div style="text-align:center;margin-top:10px"><button class="btn btn-g btn-sm" onclick="toast('Export complet en cours…','info')">⬇️ Exporter tout</button></div>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

/* ── ACTIONS ADMIN ────────────────────────── */
function validateMedecin(medId){
  const m=DB.medecins.find(x=>x.id===medId);
  if(!m)return;
  m.statut='Actif';
  toast(`✅ Compte de Dr. ${m.prenom} ${m.nom} validé — SMS envoyé`,'ok');
  render();
}

function rejectMedecin(medId){
  if(!confirm('Rejeter cette demande d\'inscription ?'))return;
  const m=DB.medecins.find(x=>x.id===medId);
  if(!m)return;
  const idx=DB.medecins.indexOf(m);
  DB.medecins.splice(idx,1);
  toast('Demande rejetée','wa');
  render();
}

function suspendMedecin(medId){
  if(!confirm('Suspendre l\'accès de ce médecin ?'))return;
  const m=DB.medecins.find(x=>x.id===medId);
  if(!m)return;
  m.statut='Suspendu';
  toast(`Compte de Dr. ${m.prenom} ${m.nom} suspendu`,'wa');
  render();
}

function showInviteMedModal(){
  const hop=getHopital(DB.session.hopId)||DB.hopitaux[0];
  setModal(`
  <div class="mo" onclick="closeModal(event)">
    <div class="md">
      <div class="md-hdr"><div class="md-ttl">+ Inviter un médecin</div><button class="md-cls" onclick="closeModalForce()">✕</button></div>
      <div class="md-bod">
        <div style="background:var(--teal-pale);border-radius:var(--rs);padding:11px 13px;font-size:.82rem;color:var(--teal);margin-bottom:16px">
          Un email d'invitation sera envoyé. Le médecin devra compléter son inscription.
        </div>
        <div class="fgrid" style="margin-bottom:13px">
          <div class="fg"><label class="lbl">Prénom *</label><input class="fc" id="inv-prenom" placeholder="Amara"></div>
          <div class="fg"><label class="lbl">Nom *</label><input class="fc" id="inv-nom" placeholder="Koné"></div>
        </div>
        <div class="fg" style="margin-bottom:13px"><label class="lbl">Email professionnel *</label><input type="email" class="fc" id="inv-email" placeholder="dr.kone@hopital.cm"></div>
        <div class="fg" style="margin-bottom:13px"><label class="lbl">Spécialité</label><select class="fc" id="inv-spec"><option>Médecine Générale</option><option>Cardiologie</option><option>Pédiatrie</option><option>Gynécologie</option><option>Chirurgie</option><option>Neurologie</option><option>Autre</option></select></div>
        <div class="fg"><label class="lbl">Message personnalisé (optionnel)</label><textarea class="fc" placeholder="Bienvenue dans notre équipe…"></textarea></div>
      </div>
      <div class="md-ftr">
        <button class="btn btn-g" onclick="closeModalForce()">Annuler</button>
        <button class="btn btn-p" onclick="doInviteMedecin()">Envoyer l'invitation</button>
      </div>
    </div>
  </div>`);
}

function doInviteMedecin(){
  const prenom=document.getElementById('inv-prenom')?.value.trim();
  const nom=document.getElementById('inv-nom')?.value.trim();
  const email=document.getElementById('inv-email')?.value.trim();
  const spec=document.getElementById('inv-spec')?.value||'Médecine Générale';
  if(!prenom||!nom||!email){ toast('Prénom, nom et email requis','er'); return; }
  const av=(prenom[0]+nom[0]).toUpperCase();
  const hop=DB.session.hopId||'HOP001';
  DB.medecins.push({
    id:'MED'+Date.now().toString().slice(-3),
    nom,prenom,spec,hop,email,
    tel:'—',statut:'En attente',av,role:'doctor'
  });
  closeModalForce();
  toast(`Invitation envoyée à Dr. ${prenom} ${nom} (${email})`,'ok');
  render();
}

function showEditMedModal(medId){
  const m=DB.medecins.find(x=>x.id===medId);
  if(!m)return;
  setModal(`
  <div class="mo" onclick="closeModal(event)">
    <div class="md">
      <div class="md-hdr"><div class="md-ttl">✏️ Modifier — Dr. ${m.prenom} ${m.nom}</div><button class="md-cls" onclick="closeModalForce()">✕</button></div>
      <div class="md-bod">
        <div class="fgrid" style="margin-bottom:13px">
          <div class="fg"><label class="lbl">Prénom</label><input class="fc" id="em-prenom" value="${m.prenom}"></div>
          <div class="fg"><label class="lbl">Nom</label><input class="fc" id="em-nom" value="${m.nom}"></div>
        </div>
        <div class="fg" style="margin-bottom:13px">
          <label class="lbl">Spécialité</label>
          <select class="fc" id="em-spec">
            ${['Médecine Générale','Cardiologie','Pédiatrie','Gynécologie','Chirurgie','Neurologie'].map(s=>`<option ${m.spec===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="fg" style="margin-bottom:13px"><label class="lbl">Email</label><input type="email" class="fc" id="em-email" value="${m.email}"></div>
        <div class="fg"><label class="lbl">Téléphone</label><input class="fc" id="em-tel" value="${m.tel}"></div>
      </div>
      <div class="md-ftr">
        <button class="btn btn-g" onclick="closeModalForce()">Annuler</button>
        <button class="btn btn-p" onclick="doEditMedecin('${medId}')">Enregistrer</button>
      </div>
    </div>
  </div>`);
}

function doEditMedecin(medId){
  const m=DB.medecins.find(x=>x.id===medId);
  if(!m){ toast('Médecin introuvable','er'); return; }
  m.prenom=document.getElementById('em-prenom')?.value||m.prenom;
  m.nom=document.getElementById('em-nom')?.value||m.nom;
  m.spec=document.getElementById('em-spec')?.value||m.spec;
  m.email=document.getElementById('em-email')?.value||m.email;
  m.tel=document.getElementById('em-tel')?.value||m.tel;
  m.av=(m.prenom[0]+m.nom[0]).toUpperCase();
  closeModalForce();
  toast(`Profil de Dr. ${m.prenom} ${m.nom} mis à jour`,'ok');
  render();
}

</script>
