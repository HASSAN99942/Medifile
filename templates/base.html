{% load static %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'fr' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}MediFile — Dossier Patient Numérique{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/main.css' %}">
{% block extra_head %}{% endblock %}
</head>
<body>
<button class="burger" id="burger" onclick="toggleSidebar()" aria-label="Menu">&#9776;</button>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div id="sidebar-wrap">{% block sidebar %}{% endblock %}</div>
<div id="root">{% block root %}{% endblock %}</div>
<div id="modal-wrap"></div>
<div class="toasts" id="toasts"></div>
<script src="{% static 'js/base.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
