{% load i18n %}
<aside class="sidebar" id="sidebar" style="background:linear-gradient(180deg,#0D1F3C 0%,#1a1060 100%)">
  <div class="s-logo">
    <div class="logo-wrap"><div class="logo-icon">🏥</div><div class="logo-txt">Medi<span>File</span></div></div>
    <div class="s-role-tag">Administrateur</div>
  </div>
  <nav class="s-nav">
    <div class="s-sect">Gestion{% if etablissement %} — {{ etablissement }}{% endif %}</div>
    <button class="ni{% if active == 'a-home' %} act{% endif %}" onclick="location.href='{% url 'core:home' %}'"><span class="ic">🏠</span>Vue d'ensemble</button>
    <button class="ni{% if active == 'a-medecins' %} act{% endif %}" onclick="location.href='#'"><span class="ic">👨‍⚕️</span>Médecins</button>
    <button class="ni{% if active == 'a-patients' %} act{% endif %}" onclick="location.href='#'"><span class="ic">👥</span>Patients</button>
    <button class="ni{% if active == 'a-hopital' %} act{% endif %}" onclick="location.href='#'"><span class="ic">🏥</span>Mon établissement</button>
    <button class="ni{% if active == 'a-stats' %} act{% endif %}" onclick="location.href='#'"><span class="ic">📊</span>Statistiques</button>
    <div class="s-sect" style="margin-top:10px">Compte</div>
    <button class="ni" onclick="location.href='#'"><span class="ic">🚪</span>Déconnexion</button>
  </nav>
  <div class="s-foot">
    <div class="u-chip">
      <div class="av" style="background:var(--purple)">AD</div>
      <div><div class="u-name">{{ nom_complet|default:"Administrateur" }}</div><div class="u-role">{{ etablissement|default:"—" }}</div></div>
    </div>
  </div>
</aside>
